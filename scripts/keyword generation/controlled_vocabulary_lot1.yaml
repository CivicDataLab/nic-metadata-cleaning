# -----------------------------------------------------------------------------
# Geography: controlled list of States & Union Territories.
# Detected as `... of <State> ...` or `<State>-wise ...` in titles.
# Canonical spelling -> regex variants. Canonical name -> sponsored keyword.
# -----------------------------------------------------------------------------
states:
  Andhra Pradesh:        ['andhra pradesh']
  Arunachal Pradesh:     ['arunachal pradesh']
  Assam:                 ['\bassam\b']
  Bihar:                 ['\bbihar\b']
  Chhattisgarh:          ['chhattisgarh', 'chattisgarh']
  Goa:                   ['\bgoa\b']
  Gujarat:               ['\bgujarat\b']
  Haryana:               ['\bharyana\b']
  Himachal Pradesh:      ['himachal pradesh']
  Jharkhand:             ['jharkhand']
  Karnataka:             ['karnataka']
  Kerala:                ['\bkerala\b']
  Madhya Pradesh:        ['madhya pradesh']
  Maharashtra:           ['maharashtra']
  Manipur:               ['\bmanipur\b']
  Meghalaya:             ['meghalaya']
  Mizoram:               ['mizoram']
  Nagaland:              ['nagaland']
  Odisha:                ['odisha', 'orissa']
  Punjab:                ['\bpunjab\b']
  Rajasthan:             ['rajasthan']
  Sikkim:                ['\bsikkim\b']
  Tamil Nadu:            ['tamil nadu', 'tamilnadu']
  Telangana:             ['telangana']
  Tripura:               ['tripura']
  Uttar Pradesh:         ['uttar pradesh']
  Uttarakhand:           ['uttarakhand', 'uttaranchal']
  West Bengal:           ['west bengal']
  Andaman and Nicobar Islands: ['andaman', 'nicobar']
  Chandigarh:            ['chandigarh']
  # '\bdaman\b' (not 'daman') so it does not match the substring in "Andaman".
  Dadra and Nagar Haveli and Daman and Diu: ['dadra', 'nagar haveli', '\bdaman\b', '\bdiu\b']
  Delhi:                 ['\bdelhi\b', '\bnct\b']
  Jammu and Kashmir:     ['jammu', 'kashmir']
  Ladakh:                ['\bladakh\b']
  Lakshadweep:           ['lakshadweep']
  Puducherry:            ['puducherry', 'pondicherry']