- facet: topic
  category: domestic_air_traffic
  patterns: ['domestic air traffic', 'domestic traffic', 'domestic aviation', 'internal air traffic', 'domestic scheduled services', 'scheduled domestic services', 'domestic services traffic']
  generic: [domestic, traffic, aviation, passenger]

- facet: topic
  category: international_air_traffic
  patterns: ['international air traffic', 'international aviation', 'international flights', 'air traffic to and from india', 'international traffic carried to and from india']
  generic: [international, traffic, aviation, passenger]

- facet: topic
  category: airport_traffic
  patterns: ['airport traffic', 'air traffic handled', 'airport movements', 'airport statistics']
  generic: [airport, traffic, passenger, freight]

- facet: topic
  category: aircraft_movements
  patterns: ['aircraft movement', 'flight movement', 'landing', 'take off']
  generic: [aircraft, flight, airport]

- facet: topic
  category: passenger_traffic
  patterns: ['passenger traffic', 'passengers carried', 'air passengers', 'passenger-kilometres', 'passenger kilometres performed', 'revenue passenger kilometre']
  generic: [passenger, traffic, aviation]

- facet: topic
  category: cargo_traffic
  patterns: ['cargo traffic', 'air cargo', 'freight traffic', 'cargo movement', 'cargo operations', 'cargo services']
  generic: [cargo, freight, logistics, aviation]

- facet: topic
  category: freight
  patterns: ['freight', 'air freight', 'cargo freight']
  generic: [freight, cargo, logistics, transport]

- facet: topic
  category: scheduled_airlines
  patterns: ['scheduled airlines', 'scheduled indian airlines', 'scheduled carriers', 'scheduled services', 'total scheduled services', 'domestic scheduled services', 'scheduled commercial traffic']
  generic: [scheduled, airline, carrier, aviation]

- facet: topic
  category: airline_performance
  patterns: ['performance indicators', 'operating traffic statistics', 'operational performance', 'comparative statement of traffic', 'traffic coefficients', 'percentage growth', 'operating revenue', 'operating expenses', 'revenue passenger kilometre']
  generic: [airline, operations, statistics]

- facet: topic
  category: operating_statistics
  patterns: ['operating statistics', 'operating traffic', 'traffic statistics', 'monthly traffic and operating statistics', 'annual traffic and operating statistics', 'year-wise traffic and operating statistics']
  generic: [operations, traffic, statistics, aviation]

- facet: topic
  category: non_scheduled_operations
  patterns: ['non-scheduled operations', 'non scheduled operations', 'non-scheduled services', 'non scheduled services']
  generic: [non-scheduled, operations, aviation, helicopter]

- facet: topic
  category: charter_flights
  patterns: ['charter flights', 'charter operations', 'charter services']
  generic: [charter, flights, tourism, aviation]

- facet: topic
  category: flight_schedule
  patterns: ['flight schedule', 'half-yearly flight schedule', 'flight schedules']
  generic: [schedule, flights, aviation, timetable]

- facet: topic
  category: operating_revenue
  patterns: ['operating revenue', 'operating expenses', 'operating revenue and operating expenses', 'operating revenue and expenses', 'revenue passenger kilometre']
  generic: [revenue, expenses, finance, operations]

- facet: topic
  category: traffic_coefficients
  patterns: ['traffic coefficients', 'selected traffic coefficients']
  generic: [coefficients, traffic, performance, aviation]

- facet: topic
  category: traffic_growth
  patterns: ['percentage growth', 'yearly percentage growth', 'traffic growth']
  generic: [ traffic, trends, aviation]

- facet: topic
  category: airline
  patterns: ['airline', 'carrier', 'air operator']
  generic: [airline, carrier, aviation, operator]

