# =============================================================================
# Controlled Keyword Vocabulary  —  data.gov.in health / HMIS datasets
# =============================================================================
# This is the curated, controlled list of keywords used to tag datasets for
# search.  It is maintained by hand by the curation team — add patterns and
# keywords here, re-run `assign_controlled_keywords.py`, and the search facets
# update.  Keep it small and clean: that bounded set is the whole point.
#
# Two tiers (matching data.gov.in's Subject[keyword] / Subject[sponsored_keyword]):
#   * generic    -> simple, layman words a non-expert would actually type
#                   ("survey", "health centre", "monthly report").
#   * sponsored  -> precise / specific values ("tuberculosis", "Delhi", "HMIS",
#                   "Auxiliary Nurse Midwife").
#
# How a rule works:
#   - `patterns`  : list of case-insensitive regex; if ANY matches the dataset's
#                   combined text (title + collection + catalog title + sector),
#                   the rule fires.
#   - `generic`   : generic keywords added to Subject[keyword] when it fires.
#   - `sponsored` : specific keywords added to Subject[sponsored_keyword].
# Layman rule: jargon (ANM, PHC, IUCD) lives only in `sponsored`; the plain-English
# word ("health worker", "health centre", "contraceptive") goes in `generic`.
# =============================================================================

limits:
  generic_max: 4
  sponsored_max: 2

# Baseline tags applied to every Ministry of Health & Family Welfare dataset
# (the corpus is ~100% MoHFW). Guarantees a non-empty, consistent floor so even
# a topic-less "Item-wise report for <district> of <state>" row is findable.
baseline:
  generic: []
  # No baseline sponsored keyword: sponsored tags must be dataset-specific
  # (states, survey names, age ranges, conditions), not a blanket label.
  sponsored: []

rules:

  # ------------------------------------------------------------------ TOPIC --
  # The sponsored tier is per-dataset SPECIFIC: rules are split fine enough that
  # the matched concept (C-section, polio, condom) becomes the keyword, not a
  # coarse bucket. The generic tier stays broad/layman.

   # --- Maternal health (broad + specific procedures) ---
- facet: topic
  category: maternal_general
  patterns: ['maternal', 'health', 'pregnan', 'obstetric', 'motherhood']
  generic:   [pregnancy, mother, childbirth, women]
  sponsored: [maternal, obstetric, maternity, reproductive]
- facet: topic
  category: allopathic
  patterns: ['allopathic']
  generic:   [medicine, doctor, hospital, treatment]
  sponsored: [allopathic, opd, treatment, attendance]

- facet: topic
  category: antenatal_care
  # NB: bare 'anaemia' is intentionally NOT here — it mistagged child-anaemia
  # datasets as antenatal. Pregnant-women anaemia still matches via \bifa\b /
  # 'pregnant women given'. General anaemia has its own rule below.
  patterns: ['ante[ -]?natal', '\banc\b', 'tetanus toxoid', '\btt\d', '\bifa\b',
             'pregnant women given']
  generic:   [pregnancy, checkup, mother, clinic]
  sponsored: [antenatal, anc, prenatal, ifa]

- facet: topic
  category: institutional_delivery
  patterns: ['institutional deliver', 'deliveries conducted', 'deliver.*at facility']
  generic:   [hospital, delivery, birth, mother]
  sponsored: [institutional, facility, obstetric, childbirth]

- facet: topic
  category: home_delivery
  patterns: ['home deliver']
  generic:   [home, delivery, birth, mother]
  sponsored: [domiciliary, childbirth, maternal, delivery]

- facet: topic
  category: c_section
  patterns: ['c-?section', 'caesarean', 'cesarean']
  generic:   [surgery, delivery, birth, hospital]
  sponsored: [caesarean, cesarean, csection, obstetric]

- facet: topic
  category: maternal_mortality
  patterns: ['maternal mortality', '\bmmr\b']
  generic:   [mother, death, childbirth, mortality]
  sponsored: [mmr, maternal, mortality, obstetric]

