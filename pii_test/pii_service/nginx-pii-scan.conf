# nginx site for the PII scan service. Install (needs sudo, nginx not yet
# installed on this box):
#   sudo cp pii_test/pii_service/nginx-pii-scan.conf /etc/nginx/sites-available/pii-scan
#   sudo ln -s /etc/nginx/sites-available/pii-scan /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Pair with pii-scan.service, which puts the socket at the path below.

upstream pii_scan {
    server unix:/run/pii-scan/gunicorn.sock fail_timeout=0;
}

server {
    listen 80;
    server_name _;                      # replace with the real hostname

    # Must be >= MAX_UPLOAD_BYTES in app.py (100 MB), or nginx rejects the
    # upload with its own 413 before the app can answer.
    client_max_body_size 100m;
    client_body_timeout 300s;

    # Own log files rather than nginx's shared default, so upload traffic is
    # easy to read next to pii_service.log.
    access_log /var/log/nginx/pii-scan.access.log;
    error_log  /var/log/nginx/pii-scan.error.log;

    # Scans are async (the page polls /jobs/<id>), so no request is ever
    # held open for the length of a scan. These only need to cover model
    # loading after a restart, when /healthz can take a moment.
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    location / {
        proxy_pass http://pii_scan;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        # Downloads stream straight through rather than buffering to disk.
        proxy_buffering off;
    }

    # Uploads are PII and so are the results. Before this is reachable
    # beyond the team: terminate TLS here (certbot), and gate it -- either
    # allow/deny by IP, or auth_basic with an htpasswd file:
    #   auth_basic "PII scan";
    #   auth_basic_user_file /etc/nginx/.htpasswd;
}
